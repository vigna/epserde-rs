[package]
name = "epserde"
authors = [
	"Tommaso Fontana <tommaso.fontana.96@gmail.com>",
	"Valentin Lorentz <vlorentz@softwareheritage.org>",
	"Sebastiano Vigna <sebastiano.vigna@unimi.it>",
]
description = "ε-serde is an ε-copy (i.e., almost zero-copy) serialization/deserialization framework"
version = "0.13.2"
edition = "2024"
repository = "https://github.com/vigna/epserde-rs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["serialization", "zero-copy", "mmap"]
categories = ["encoding", "no-std"]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true

[dependencies]
mem_dbg = { version = ">=0.4.2", features = [ "derive", "aliasable", "maybe-dangling"], default-features = false, optional = true }
mmap-rs = { version = "0.7.0", optional = true }
bitflags = { version = "2.9.4", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
epserde-derive = { workspace = true, optional = true }
anyhow = { version = "1.0.100", default-features = false }
thiserror = { version = "2.0.16", default-features = false }
sealed = "0.6.0"
aliasable = "0.1.3"
maybe-dangling = "0.1.2"

[dev-dependencies]
trybuild = "1.0.111"

[features]
default = ["std", "mmap", "derive"]
# Procedural macros
derive = ["epserde-derive"]
# Standard library support; without it, the crate is no_std (with alloc).
# Note that std and mem_dbg enable each other.
std = ["anyhow/std", "thiserror/std", "mem_dbg/std"]
# Memory-mapped file support (requires std)
mmap = ["std", "mmap-rs", "mem_dbg/mmap-rs"]
# Implementations of MemDbg and MemSize (the mem_dbg derive macros require std)
mem_dbg = ["dep:mem_dbg", "std"]
# For compiling examples with schema output
schema = []
